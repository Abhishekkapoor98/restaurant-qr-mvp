<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-3xl font-black mb-6 text-center text-gray-800">Scan & Order 🍔</h1>
        
        <div class="space-y-4 mb-8">
            {{range .menu}}
            <div class="border border-gray-200 p-4 rounded-lg flex justify-between items-center bg-gray-50 hover:bg-white transition">
                <div>
                    <h2 class="font-bold text-lg text-gray-800">{{.Name}}</h2>
                    <p class="text-gray-500 text-sm">{{.Category}} - ₹{{.Price}}</p>
                </div>
                <button onclick="addToCart('{{.Name}}', {{.Price}})" class="bg-black text-white px-4 py-2 rounded-lg font-bold shadow-sm hover:bg-gray-800">+ Add</button>
            </div>
            {{end}}
        </div>

        <form action="/api/orders" method="POST" class="bg-gray-100 p-4 rounded-lg border border-gray-200">
            <h3 class="font-bold mb-3 text-gray-700">Confirm Your Order:</h3>
            <!-- Agar URL me table number hai, toh automatic fill hoke 'readonly' (lock) ho jayega -->
<input type="number" name="table_number" placeholder="Enter Table Number" required class="w-full border-gray-300 p-3 rounded mb-3 bg-gray-100" min="1" value="{{.table}}" {{if .table}}readonly{{end}}>
            <textarea id="itemsText" name="items" readonly class="w-full p-3 rounded mb-3 text-sm text-gray-600 bg-white border border-gray-300" placeholder="Selected items will appear here..." required></textarea>
            <input type="number" id="totalAmount" name="total_amount" readonly class="w-full p-3 rounded mb-4 font-bold text-green-700 bg-green-50 border border-green-200" placeholder="Total: ₹0" required>
            <button type="submit" class="w-full bg-green-600 text-white font-black text-lg py-3 rounded-lg shadow-md hover:bg-green-700">Place Order to Kitchen</button>
        </form>
    </div>

    <script>
        let items = [];
        let total = 0;
        function addToCart(name, price) {
            items.push(name);
            total += price;
            document.getElementById('itemsText').value = items.join(', ');
            document.getElementById('totalAmount').value = total;
        }
    </script>
</body>
</html>
